name: Release

# Releases are cut by pushing a version tag (``vX.Y.Z``) that matches
# pyproject.toml / __init__.py / AppStream and points at a commit on main.
on:
  push:
    tags: ["v*"]
  # Manual re-run of an existing tag (e.g. after a failed publish).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v0.2.0"
        required: true
        type: string

# Least privilege by default. Only the small publish job, which runs no
# third-party build code, gets a write-scoped token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Tag push: the tag itself. Manual run: the requested tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          # pip installs and tests run in this job; keep no token in .git/config.
          persist-credentials: false

      - name: Verify tag matches version and main
        id: version
        env:
          # Via env, never interpolated into the script (input is user-supplied).
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z (got '${REQUESTED_TAG}')"
            exit 1
          fi

          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          init_version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("src/qbit_plugin_dl/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', text, re.M)
          if not match:
              raise SystemExit("Could not parse __version__")
          print(match.group(1))
          PY
          )"

          if [[ "$version" != "$init_version" ]]; then
            echo "::error::Version mismatch: pyproject.toml=$version __init__.py=$init_version"
            exit 1
          fi

          if ! grep -q "version=\"${version}\"" appimage/qbit-plugin-dl.appdata.xml; then
            echo "::error::AppStream release entry missing version ${version}"
            exit 1
          fi

          tag="v${version}"
          if [[ "${REQUESTED_TAG}" != "${tag}" ]]; then
            echo "::error::Tag ${REQUESTED_TAG} does not match project version ${version} (expected ${tag})"
            exit 1
          fi

          sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          # Only release reviewed code: the tagged commit must be on main.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${sha}" FETCH_HEAD; then
            echo "::error::Tag ${tag} (${sha}) is not on main"
            exit 1
          fi

          echo "Will release ${tag} at ${sha}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            sudo apt-get install -y desktop-file-utils libfuse2t64 libgl1 libxkbcommon0 libegl1 libdbus-1-3 libxcb-cursor0 xvfb
          else
            sudo apt-get install -y desktop-file-utils libfuse2 libgl1 libxkbcommon0 libegl1 libdbus-1-3 libxcb-cursor0 xvfb
          fi

      - name: Install package and run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          # Hash-pinned from uv.lock: this job also builds the release.
          pip install --require-hashes -r requirements/dev.lock.txt
          python -m pytest -q

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          PYTHON_VERSION: "3.12"
        run: |
          set -euo pipefail
          chmod +x scripts/build-appimage.sh scripts/sync-icons.sh
          ./scripts/build-appimage.sh
          ls -lh qbit-plugin-dl*.AppImage

      - name: Smoke-test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(qbit-plugin-dl*.AppImage)
          if [[ ${#images[@]} -eq 0 ]]; then
            echo "::error::No AppImage artifact found for smoke test"
            exit 1
          fi
          image="$(readlink -f "${images[0]}")"
          chmod +x "${image}"

          # Host toolchains (setup-python) inject LD_LIBRARY_PATH; clear it so the
          # AppImage runtime and bundled libs win.
          run_app() { env -u LD_LIBRARY_PATH -u PYTHONPATH -u PYTHONHOME "$@"; }

          run_app "${image}" --version | tee /tmp/qbit-plugin-dl-version.txt
          grep -q 'qbit-plugin-dl' /tmp/qbit-plugin-dl-version.txt

          work="$(mktemp -d)"
          cleanup() { rm -rf "${work}"; }
          trap cleanup EXIT
          (
            cd "${work}"
            run_app "${image}" --appimage-extract >/dev/null
            bundled="$(find squashfs-root -name 'libxcb-cursor.so.0' -print -quit)"
            if [[ -z "${bundled}" ]]; then
              echo "::error::libxcb-cursor.so.0 was not bundled into the AppImage"
              exit 1
            fi
            echo "Bundled cursor lib: ${bundled}"
            if [[ ! -e squashfs-root/usr/lib/libxcb-cursor.so.0 ]]; then
              echo "::error::libxcb-cursor.so.0 missing from usr/lib (AppImage LD_LIBRARY_PATH)"
              exit 1
            fi
            qxcb="$(find squashfs-root -path '*/platforms/libqxcb.so' -print -quit)"
            if [[ -z "${qxcb}" ]]; then
              echo "::error::libqxcb.so missing from AppImage"
              exit 1
            fi
            if ldd "${qxcb}" | grep -F 'libxcb-cursor.so.0' | grep -q 'not found'; then
              echo "::error::libqxcb.so still cannot resolve libxcb-cursor.so.0"
              ldd "${qxcb}" | grep -F 'libxcb-cursor' || true
              exit 1
            fi
            resolved="$(ldd "${qxcb}" | awk '/libxcb-cursor\.so\.0/ && !f {f = $3} END {print f}')"
            if [[ -n "${resolved}" && "${resolved}" != *"squashfs-root"* ]]; then
              echo "::warning::libxcb-cursor resolved outside the AppImage tree: ${resolved}"
            fi
          )

          # Launch smoke: offscreen avoids CI/host xcb-cursor dlopen quirks while
          # still proving the AppImage Python/Qt stack starts. Bundling checks
          # above remain the hard guarantee for libxcb-cursor.so.0 placement.
          set +e
          timeout 12 env -u LD_LIBRARY_PATH -u PYTHONPATH -u PYTHONHOME \
            QT_QPA_PLATFORM=offscreen \
            "${image}" >/tmp/qbit-plugin-dl-gui.log 2>&1
          rc=$?
          set -e
          # 124 = still running when timeout fired (expected for a GUI event loop).
          if [[ "${rc}" -ne 124 && "${rc}" -ne 0 ]]; then
            echo "::error::AppImage GUI smoke failed with exit ${rc}"
            cat /tmp/qbit-plugin-dl-gui.log || true
            exit 1
          fi
          if grep -qiE 'Could not load the Qt platform plugin|Aborted \(core dumped\)' /tmp/qbit-plugin-dl-gui.log; then
            echo "::error::AppImage GUI smoke log shows Qt/platform failure"
            cat /tmp/qbit-plugin-dl-gui.log
            exit 1
          fi
          echo "AppImage smoke OK (gui exit ${rc})"

          # Best-effort xcb under Xvfb — warn only (host/AppImage loader interactions
          # have produced false failures even with libxcb-cursor bundled).
          set +e
          timeout 8 xvfb-run -a env -u LD_LIBRARY_PATH -u PYTHONPATH -u PYTHONHOME \
            "${image}" >/tmp/qbit-plugin-dl-xcb.log 2>&1
          xrc=$?
          set -e
          if [[ "${xrc}" -ne 124 && "${xrc}" -ne 0 ]] \
            || grep -qiE 'Could not load the Qt platform plugin|libxcb-cursor0 is needed' /tmp/qbit-plugin-dl-xcb.log; then
            echo "::warning::Xvfb/xcb smoke did not fully pass (exit ${xrc}); bundled lib checks still OK"
            cat /tmp/qbit-plugin-dl-xcb.log || true
          else
            echo "Xvfb/xcb smoke OK (exit ${xrc})"
          fi

      - name: Write checksums
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(qbit-plugin-dl*.AppImage)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No AppImage artifact found"
            exit 1
          fi

          checksums="SHA256SUMS.txt"
          : > "$checksums"
          for asset in "${assets[@]}"; do
            sha256sum "$asset" >> "$checksums"
          done
          cat "$checksums"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            qbit-plugin-dl*.AppImage
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # Build provenance attestation (Sigstore via GitHub OIDC). Kept out of
      # the build job so code run there cannot mint attestations.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The exact commit the build job verified and built.
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            qbit-plugin-dl*.AppImage
            SHA256SUMS.txt

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(qbit-plugin-dl*.AppImage)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No AppImage artifact found"
            exit 1
          fi
          checksums="SHA256SUMS.txt"
          sha256sum -c "$checksums"

          # Previous release tag reachable from this one (not the tag itself).
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "${SHA}^" 2>/dev/null || true)"

          {
            echo "## qbit - Torrent Plugin Manager ${VERSION}"
            echo
            echo "Selective installer for qBittorrent search plugins (multi-source catalogs, update checks, AppImage)."
            echo
            echo "### Assets"
            echo
            for asset in "${assets[@]}"; do
              size="$(du -h "$asset" | cut -f1)"
              echo "- \`${asset}\` (${size})"
            done
            echo
            echo "Verify downloads:"
            echo
            echo '```'
            cat "$checksums"
            echo '```'
            echo
            echo "Verify provenance (built by this repository's release workflow):"
            echo
            echo '```'
            echo "gh attestation verify qbit-plugin-dl-x86_64.AppImage --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            if [[ -n "$prev_tag" && "$prev_tag" != "$TAG" ]]; then
              echo "### Changes since ${prev_tag}"
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${TAG}"
            else
              echo "### Initial release"
              echo
              echo "This is the first tagged release of qbit - Torrent Plugin Manager."
            fi
            echo
            echo "---"
            echo

            gen_args=( -f "tag_name=${TAG}" -f "target_commitish=${SHA}" )
            if [[ -n "$prev_tag" && "$prev_tag" != "$TAG" ]]; then
              gen_args+=( -f "previous_tag_name=${prev_tag}" )
            fi
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              "${gen_args[@]}" \
              --jq .body
          } > RELEASE_NOTES.md

          echo "----- release notes preview -----"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(qbit-plugin-dl*.AppImage SHA256SUMS.txt)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; delete it first to re-publish"
            exit 1
          fi

          # The tag already exists (it triggered this run); never create one.
          gh release create "$TAG" \
            --verify-tag \
            --title "qbit - Torrent Plugin Manager ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            "${files[@]}"
